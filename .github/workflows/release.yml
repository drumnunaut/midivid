name: Build & publish desktop installers

# Builds native installers on every version tag (v1.2.3) and attaches them to
# the GitHub Release — which also feeds MIDIVid's in-app auto-updater:
#   - Windows: NSIS installer (.exe)  → enables Windows auto-update
#   - macOS:   .dmg + .zip (x64 + Apple Silicon)
#   - Linux:   AppImage
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # No code-signing certificates in CI (see the signing tasks)
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
